<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#0b1220"/>
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1f2a44" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <g stroke="#38bdf8" stroke-width="3">
    <line x1="0" y1="500" x2="1600" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
  </g>
  <circle cx="800" cy="500" r="220" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="800" y="525" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="40">1600 x 1000</text>
  <g fill="#64748b" font-family="monospace" font-size="28">
    <text x="24" y="46">A</text>
    <text x="1552" y="46" text-anchor="end">B</text>
    <text x="24" y="966">C</text>
    <text x="1552" y="966" text-anchor="end">D</text>
  </g>
</svg>
